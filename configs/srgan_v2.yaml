# v2 targets faster training at equal quality: larger batches stabilize BatchNorm,
# workers remove the data-loader bottleneck, and the result must be validated against the first run.
_base_:
  - base.yaml
  - data.yaml

model:
  name: srgan_generator
  in_channels: 3
  out_channels: 3
  channels: 64
  num_blocks: 16
  upscale_factor: 4
  input_range: [0.0, 1.0]
  output_range: [0.0, 1.0]
  pretrained_weights: checkpoints/pretrained/SRGAN_x4-ImageNet.pth.tar
  allow_weights_only_false: false
  dummy_input_size: [1, 3, 24, 24]
  discriminator:
    name: srgan_discriminator
    in_channels: 3
    out_channels: 1
    channels: 64

training:
  epochs: 8
  batch_size: 8  # larger batches stabilize BatchNorm and improve GPU utilization
  num_workers: 4  # parallel workers remove the original data-loader bottleneck
  val_num_workers: 0
  channels_last: true  # use the RTX convolution layout for faster training
  freeze_generator_bn: true  # avoid noisy running statistics during GAN fine-tuning
  amp: true
  grad_clip_norm: null
  log_every_n_iters: 100
  val_every_n_epochs: 1
  val_subset_size: 500
  save_every_n_epochs: 1
  max_iters: null
  run_name: srgan_v2  # keep optimized runs separate from the original run
  metrics:
    border: 4
    ssim_window_size: 11
    ssim_sigma: 1.5
    lpips_net: alex
  perceptual:
    feature_layer: 35
    kind: mse
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  adversarial:
    kind: bce
    real_label_smoothing: 0.0
  stages:
    pixel_warmup:
      epochs: 2
      best_metric: psnr
      optimizer:
        name: Adam
        lr: 0.0001
        betas: [0.9, 0.999]
        weight_decay: 0.0
      scheduler:
        name: none
        params: {}
      pixel_loss: l1
    gan:
      epochs: 8
      best_metric: lpips
      g_optimizer:
        name: Adam
        lr: 0.00001
        betas: [0.9, 0.999]
        weight_decay: 0.0
      d_optimizer:
        name: Adam
        lr: 0.00001
        betas: [0.9, 0.999]
        weight_decay: 0.0
      g_scheduler:
        name: none
        params: {}
      d_scheduler:
        name: none
        params: {}
      w_pixel: 0.01
      w_perceptual: 1.0
      w_adv: 0.001
      d_warmup_iters: 300

training_crop:
  hr_crop_size: 128  # smaller crops fit larger batches without changing observed pixels per epoch
  crops_per_patch: 4  # four random crops preserve the original 256-pixel exposure per patch

dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: true  # overlap host-to-device copies with GPU work
  persistent_workers: true
  prefetch_factor: 4

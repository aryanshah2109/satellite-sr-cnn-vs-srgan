_base_:
  - base.yaml
  - data.yaml

model:
  name: cnn_sr
  in_channels: 3
  out_channels: 3
  channels: 64
  num_blocks: 16
  res_scale: 0.1
  upscale_factor: 4
  input_range: [0.0, 1.0]
  dummy_input_size: [1, 3, 24, 24]

training:
  epochs: 30
  batch_size: 2
  num_workers: 0
  amp: true
  grad_clip_norm: null
  log_every_n_iters: 100
  val_every_n_epochs: 1
  val_subset_size: 500
  save_every_n_epochs: 1
  max_iters: null
  run_name: cnn
  best_metric: psnr
  optimizer:
    name: Adam
    lr: 0.0002
    betas: [0.9, 0.999]
    weight_decay: 0.0
  scheduler:
    name: cosine
    params: {}
  loss:
    kind: l1
  metrics:
    border: 4
    ssim_window_size: 11
    ssim_sigma: 1.5
    lpips_net: alex

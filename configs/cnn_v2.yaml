# v2 targets faster training at equal quality: larger batches stabilize BatchNorm,
# workers remove the data-loader bottleneck, and the result must be validated against the first run.
_base_:
  - base.yaml
  - data.yaml

model:
  name: cnn_sr
  in_channels: 3
  out_channels: 3
  channels: 64
  num_blocks: 16
  res_scale: 0.1
  upscale_factor: 4
  input_range: [0.0, 1.0]
  dummy_input_size: [1, 3, 24, 24]

training:
  epochs: 30
  batch_size: 8  # larger batches reduce noisy BatchNorm statistics and improve GPU utilization
  num_workers: 4  # parallel workers remove the original data-loader bottleneck
  val_num_workers: 0
  channels_last: true  # use the RTX convolution layout for faster training
  amp: true
  grad_clip_norm: null
  log_every_n_iters: 100
  val_every_n_epochs: 2
  val_subset_size: 500
  save_every_n_epochs: 1
  max_iters: null
  run_name: cnn_v2  # keep optimized runs separate from the original run
  best_metric: psnr
  optimizer:
    name: Adam
    lr: 0.0002
    betas: [0.9, 0.999]
    weight_decay: 0.0
  scheduler:
    name: cosine
    params: {}
  loss:
    kind: l1
  metrics:
    border: 4
    ssim_window_size: 11
    ssim_sigma: 1.5
    lpips_net: alex

training_crop:
  hr_crop_size: 128  # smaller crops fit larger batches without changing observed pixels per epoch
  crops_per_patch: 4  # four random crops preserve the original 256-pixel exposure per patch

dataloader:
  batch_size: 8
  num_workers: 4
  pin_memory: true  # overlap host-to-device copies with GPU work
  persistent_workers: true
  prefetch_factor: 4

_base_:
  - base.yaml
  - data.yaml

model:
  name: srgan_generator
  in_channels: 3
  out_channels: 3
  channels: 64
  num_blocks: 16
  upscale_factor: 4
  input_range: [0.0, 1.0]
  output_range: [0.0, 1.0]
  pretrained_weights: checkpoints/pretrained/SRGAN_x4-ImageNet.pth.tar
  allow_weights_only_false: false
  dummy_input_size: [1, 3, 24, 24]
  discriminator:
    name: srgan_discriminator
    in_channels: 3
    out_channels: 1
    channels: 64

training:
  epochs: 8
  batch_size: 2
  num_workers: 0
  amp: true
  grad_clip_norm: null
  log_every_n_iters: 100
  val_every_n_epochs: 1
  val_subset_size: 500
  save_every_n_epochs: 1
  max_iters: null
  run_name: srgan
  metrics:
    border: 4
    ssim_window_size: 11
    ssim_sigma: 1.5
    lpips_net: alex
  perceptual:
    feature_layer: 35
    kind: mse
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  adversarial:
    kind: bce
    real_label_smoothing: 0.0
  stages:
    pixel_warmup:
      epochs: 2
      best_metric: psnr
      optimizer:
        name: Adam
        lr: 0.0001
        betas: [0.9, 0.999]
        weight_decay: 0.0
      scheduler:
        name: none
        params: {}
      pixel_loss: l1
    gan:
      epochs: 8
      best_metric: lpips
      g_optimizer:
        name: Adam
        lr: 0.00001
        betas: [0.9, 0.999]
        weight_decay: 0.0
      d_optimizer:
        name: Adam
        lr: 0.00001
        betas: [0.9, 0.999]
        weight_decay: 0.0
      g_scheduler:
        name: none
        params: {}
      d_scheduler:
        name: none
        params: {}
      w_pixel: 0.01
      w_perceptual: 1.0
      w_adv: 0.001
      d_warmup_iters: 300
